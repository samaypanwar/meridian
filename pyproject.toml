[tool.poetry]
name = "meridian"
version = "0.1.0"
description = "Proto experiment: 2026-08-19-meridian"
authors = ["Samay Panwar <samaybhuvi@gmail.com>"]
packages = [{ include = "meridian", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pydantic-settings = "^2.15.0"
sqlite-vec = "^0.1.9"
pysqlite3 = "^0.6.0"
trafilatura = "^2.2.0"
pymupdf = "^1.28.2"
youtube-transcript-api = "^1.2.4"
httpx = "^0.28.1"
fastapi = "^0.141.1"
uvicorn = "^0.52.4"
sentence-transformers = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

